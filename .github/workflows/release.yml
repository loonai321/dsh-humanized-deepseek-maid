name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build source package
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          # 打包插件源码（排除 git/依赖/运行时文件），命名与 Release 一致
          tar --exclude='.git' --exclude='node_modules' --exclude='config.json' \
              --exclude='DeepseekMemory' --exclude='runtime.log' --exclude='*.tmp' \
              -czf "dist/dsh-humanized-deepseek-maid-${VERSION}.tar.gz" .
          cd dist
          sha256sum *.tar.gz > SHA256SUMS.txt

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/SHA256SUMS.txt
